pluginManagement {
    repositories {
        maven { url = 'https://maven.neoforged.net/releases' }
        maven { url = 'https://maven.fabricmc.net/' }
        gradlePluginPortal()
    }
}

rootProject.name = 'absmod'
includeBuild('1.21.1NeoForge') { name = 'absmod-neoforge-1.21.1' }
if (providers.gradleProperty('archivedTargets').isPresent()) {
    rootProject.buildFileName = 'build-archive.gradle'
    include 'neoforge', 'fabric'
    project(':neoforge').projectDir = file('26.2NeoForge')
    project(':fabric').projectDir = file('26.2Fabric')
}
