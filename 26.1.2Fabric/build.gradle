plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom' version '1.17.20'
}

group = 'com.abyssredemption.absmod'
version = '0.1.0+26.1.2'
base.archivesName = 'absmod-fabric'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(25)
    withSourcesJar()
}

dependencies {
    minecraft 'com.mojang:minecraft:26.1.2'
    implementation 'net.fabricmc:fabric-loader:0.19.5'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.155.3+26.1.2'
}

// Share the established implementation. Local files replace only classes with 26.1.2 API differences.
def portJava = file('src/compat/java')
def sharedJava = ['../common/src/main/java', '../26.2Fabric/src/main/java', '../client-bedrock/src/main/java'].collect { root ->
    fileTree(root) {
        exclude { entry -> new File(portJava, entry.relativePath.pathString).isFile() }
    }
}
sourceSets.main.java.srcDir(portJava)
tasks.named('compileJava') { source(sharedJava) }
tasks.named('sourcesJar') { from(sharedJava) }
sourceSets.main.resources.srcDirs('../common/src/main/resources', '../client-bedrock/src/main/resources')
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.compilerArgs.addAll(['-Xmaxerrs', '300']) }

def visualTest = providers.gradleProperty('portVisualTest').isPresent()
if (visualTest) {
    sourceSets.main.java.srcDir('src/visualtest/java')
    dependencies { compileOnly fileTree('run/mods') { include '*.jar' } }
}

processResources {
    inputs.property 'version', project.version
    inputs.property 'visualTest', visualTest
    filesMatching('fabric.mod.json') { expand version: project.version }
    if (visualTest) {
        doLast {
            def metadataFile = new File(destinationDir, 'fabric.mod.json')
            def metadata = new groovy.json.JsonSlurper().parse(metadataFile)
            metadata.entrypoints.client.add('com.abyssredemption.absmod.fabric.PortVisualTest')
            metadataFile.setText(groovy.json.JsonOutput.toJson(metadata), 'UTF-8')
        }
    }
}

if (providers.gradleProperty('gameTests').isPresent()) {
    fabricApi.configureTests {
        createSourceSet = true
        modId = 'absmod_test'
        enableGameTests = true
        enableClientGameTests = false
    }
    def gameTestJava = layout.buildDirectory.dir('generated/gametestJava')
    def adaptGameTests = tasks.register('adaptGameTests', Copy) {
        from('../26.2Fabric/src/gametest/java')
        into(gameTestJava)
        filteringCharset = 'UTF-8'
        filter { line -> line.replace('EntityTypes', 'EntityType')
                .replace('helper.makeMockServerPlayer(GameType.SURVIVAL)', 'helper.makeMockServerPlayerInLevel()') }
    }
    tasks.named('compileGametestJava') {
        dependsOn(adaptGameTests)
        source(gameTestJava)
    }
    sourceSets.gametest.resources.srcDir('../26.2Fabric/src/gametest/resources')
}
