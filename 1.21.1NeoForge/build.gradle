plugins {
    id 'java-library'
    id 'net.neoforged.moddev' version '2.0.146'
}
group = 'com.abyssredemption.absmod'
version = '0.5.0+1.21.1'
base.archivesName = 'absmod-neoforge'
java {
    toolchain.languageVersion = JavaLanguageVersion.of(21)
    withSourcesJar()
}
neoForge {
    version = '21.1.265'
    runs {
        client { client() }
        server { server(); programArgument '--nogui' }
    }
    mods { absmod { sourceSet sourceSets.main } }
}
// Compile against the same optional integrations used by the isolated client.
repositories { maven { url = 'https://api.modrinth.com/maven'; content { includeGroup 'maven.modrinth' } } }
dependencies {
    ['farmers-delight': ['XTVZDOol', 'FarmersDelight-1.21.1-1.3.4.jar'],
     'curios': ['KJsZIQrT', 'curios-neoforge-9.6.0+1.21.1.jar']].each { slug, release ->
        def local = file("run/mods/" + release[1])
        compileOnly(local.exists() ? files(local) : "maven.modrinth:${slug}:${release[0]}")
    }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }

sourceSets.main.java.srcDir "../common/src/minecraft1211/java"
tasks.withType(JavaCompile).configureEach { options.compilerArgs.addAll(["-Xmaxerrs", "300"]) }

// Compile with the host JDK to avoid Java 21 worker argument-file quoting on apostrophe paths.
// The emitted bytecode/API level remains Java 21; game runs use the Java 21 toolchain above.
tasks.withType(JavaCompile).configureEach {
    javaCompiler = javaToolchains.compilerFor { languageVersion = JavaLanguageVersion.of(25) }
    options.release = 21
}

processResources {
    from('../common/src/main/resources') {
        exclude 'absmod.mixins.json', 'assets/absmod/items/**', 'data/absmod/cat_variant/**',
                'data/minecraft/tags/item/swords.json', 'assets/absmod/textures/item/pink_milkshake.png', 'assets/absmod/textures/item/resonance_heart.png'
    }
    from('../client-bedrock/src/main/resources')
    inputs.file '../common/src/main/resources/data/minecraft/tags/item/swords.json'
    inputs.dir 'src/main/language'
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
    doLast {
        def swords = 'data/minecraft/tags/item/swords.json'
        def parserForTags = new groovy.json.JsonSlurper()
        def swordTag = parserForTags.parse(file('../common/src/main/resources/' + swords))
        swordTag.values.addAll(parserForTags.parse(file('src/main/resources/' + swords)).values)
        new File(destinationDir, swords).setText(groovy.json.JsonOutput.toJson(swordTag), 'UTF-8')
        fileTree('src/main/language').matching { include '*.json' }.each { overlay ->
            def target = new File(destinationDir, 'assets/absmod/lang/' + overlay.name)
            def parser = new groovy.json.JsonSlurper()
            target.setText(groovy.json.JsonOutput.toJson(parser.parse(target) + parser.parse(overlay)), 'UTF-8')
        }
        def rootAdvancement = new File(destinationDir, 'data/absmod/advancement/progression/root.json')
        if(rootAdvancement.exists()) {
            def advancement = new groovy.json.JsonSlurper().parse(rootAdvancement)
            advancement.display.background = 'minecraft:textures/gui/advancements/backgrounds/stone.png'
            rootAdvancement.setText(groovy.json.JsonOutput.toJson(advancement), 'UTF-8')
        }
        fileTree(destinationDir).matching { include 'data/absmod/recipe/**/*.json' }.each { recipe ->
            def json = new groovy.json.JsonSlurper().parse(recipe)
            def ingredient = { value -> value instanceof String ? (value.startsWith('#') ? [tag:value.substring(1)] : [item:value]) : value }
            if(json.ingredients) json.ingredients = json.ingredients.collect(ingredient)
            if(json.key) json.key = json.key.collectEntries { key,value -> [(key):ingredient(value)] }
            recipe.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json)), 'UTF-8')
        }
    }
}
['Client', 'Server'].each { runName ->
tasks.named('prepare' + runName + 'Run') {
    doLast {
        [runName.toLowerCase() + 'RunProgramArgs.txt',runName.toLowerCase() + 'RunVmArgs.txt'].each { name ->
            def argsFile = layout.buildDirectory.file("moddev/${name}").get().asFile
            argsFile.setText(argsFile.readLines('UTF-8').collect { line ->
                line.contains("'") && !line.startsWith('"') ? '"' + line + '"' : line
            }.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}
}

if (providers.gradleProperty("portVisualTest").isPresent()) { sourceSets.main.java.srcDir "src/visualtest/java"; dependencies { compileOnly fileTree(dir: "run/mods", include: "*.jar") } }

if (providers.gradleProperty("catVisualTest").isPresent()) { sourceSets.main.java.srcDir "src/cattest/java"; dependencies { compileOnly fileTree(dir: "run/mods", include: "*.jar") } }

if (providers.gradleProperty("spiritRecoveryTest").isPresent()) {
    sourceSets.main.java.srcDir "src/recoverytest/java"
}

// Explicit fault injection in a disposable world. Never part of a release.
if (providers.gradleProperty("catLifePhase").isPresent()) {
    sourceSets.main.java.srcDir "src/catlifeverification/java"
    dependencies { compileOnly fileTree(dir: "run/mods", include: "*.jar") }
    neoForge.runs.client.systemProperty "absmod.catLifePhase", providers.gradleProperty("catLifePhase").get()
    neoForge.runs.client.systemProperty "absmod.catLifeWorld", providers.gradleProperty("catLifeWorld").get()
}

if (providers.gradleProperty("resonanceRecoveryPhase").isPresent()) {
    sourceSets.main.java.srcDir "src/resonancetest/java"
    neoForge.runs.client.systemProperty "absmod.resonancePhase", providers.gradleProperty("resonanceRecoveryPhase").get()
    neoForge.runs.client.systemProperty "absmod.resonanceWorld", providers.gradleProperty("resonanceRecoveryWorld").get()
}

if (providers.gradleProperty("spiritTransferPhase").isPresent()) {
    sourceSets.main.java.srcDir "src/transfertest/java"
    neoForge.runs.client.systemProperty "absmod.transferPhase", providers.gradleProperty("spiritTransferPhase").get()
    neoForge.runs.client.systemProperty "absmod.transferWorld", providers.gradleProperty("spiritTransferWorld").get()
}

if (providers.gradleProperty("workshopTest").isPresent()) {
    sourceSets.main.java.srcDir "src/workshoptest/java"
    dependencies { compileOnly fileTree(dir: "run/mods", include: "*.jar") }
}

if (providers.gradleProperty("standaloneTest").isPresent()) {
    sourceSets.main.java.srcDir "src/standalonetest/java"
    neoForge.runs.server.gameDirectory = layout.buildDirectory.dir("standalone-test")
}

if (providers.gradleProperty("interiorsTest").isPresent()) {
    sourceSets.main.java.srcDir "src/interiorstest/java"
    dependencies { compileOnly fileTree(dir: "run/mods", include: "*.jar") }
}
