plugins { id 'net.neoforged.moddev' }

// Explicit opt-in client visual harness. Excluded from normal artifacts.
if (providers.gradleProperty('spiritVisualTest').isPresent()) {
    sourceSets.main.java.srcDir 'src/visualtest/java'
}
if (providers.gradleProperty('motionVisualTest').isPresent()) {
    sourceSets.main.java.srcDir 'src/motiontest/java'
}
if (providers.gradleProperty('progressionVisualTest').isPresent()) {
    sourceSets.main.java.srcDir 'src/progressiontest/java'
}

neoForge {
    version = rootProject.neo_version
    runs {
        client {
            client()
            if (providers.gradleProperty('motionPeer').isPresent()) {
                systemProperty 'absmod.motionPeer', providers.gradleProperty('motionPeer').get()
                programArguments.addAll('--username', providers.gradleProperty('motionPeer').get() == 'observer' ? 'MotionGuest' : 'MotionHost')
                programArguments.addAll('--gameDir', layout.projectDirectory.dir('run-' + providers.gradleProperty('motionPeer').get()).asFile.absolutePath)
            }
        }
        server { server(); programArgument '--nogui' }
    }
    mods {
        absmod { sourceSet sourceSets.main }
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') { expand version: project.version }
}

// ModDevGradle 2.0.146 leaves apostrophes unquoted in Java argument files.
// A checkout such as Ab'sMod otherwise resolves its asset directory as D:\Ab.
tasks.named('prepareClientRun') {
    doLast {
        ['clientRunProgramArgs.txt', 'clientRunVmArgs.txt'].each { name ->
            def argsFile = layout.buildDirectory.file("moddev/${name}").get().asFile
            argsFile.setText(argsFile.readLines('UTF-8').collect { line ->
                line.contains("'") && !line.startsWith('"') ? '"' + line + '"' : line
            }.join(System.lineSeparator()) + System.lineSeparator(), 'UTF-8')
        }
    }
}
